[package]
name = "flaca"
version = "3.9.5"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "Brute-force, lossless GIF, JPEG, and PNG compression."
readme = "../README.md"
publish = false
exclude = [
	".gitignore",
	".righteous-sandbox.json",
	"doc",
	"justfile",
	"release",
]

[package.metadata.deb]
maintainer = "Josh Stoik <josh@blobfolio.com>"
copyright = "2026, Blobfolio, LLC <hello@blobfolio.com>"
license-file = ["../LICENSE", "0"]
extended-description = """\n\
Flaca is a CLI tool for x86-64 Linux machines that simplifies the task of losslessly compressing GIF, JPEG, and PNG images for use on the web.\n\
.\n\
Compression is mainly achieved through the removal of metadata and optimization of pixel tables and block layouts/compression. Under the hood, flaca leverages the `jpegtran` functionality from MozJPEG for JPEG images and Oxipng for PNG images for additional savings."""
revision = "1"
depends = "$auto"
section = "graphics"
assets = [
    ["../target/release/flaca", "usr/bin/", "755"],
    ["../release/completions/flaca.bash", "etc/bash_completion.d/", "644"],
    ["../release/man/flaca.1.gz", "usr/share/man/man1/", "644"],
]

[package.metadata.bashman]
name = "Flaca"
bash-dir = "../release/completions"
man-dir = "../release/man"
credits-dir = "../"

[[package.metadata.bashman.switches]]
short = "-h"
long = "--help"
description = "Print help information and exit."

[[package.metadata.bashman.switches]]
long = "--no-gif"
description = "Skip GIF images."

[[package.metadata.bashman.switches]]
long = "--no-jpeg"
description = "Skip JPEG images."

[[package.metadata.bashman.switches]]
long = "--no-png"
description = "Skip PNG images."

[[package.metadata.bashman.switches]]
long = "--no-symlinks"
description = "Ignore symlinks (rather than following them)."

[[package.metadata.bashman.switches]]
long = "--preserve-meta"
description = "(Try to) preserve image metadata, at the cost of larger output sizes."

[[package.metadata.bashman.switches]]
long = "--preserve-times"
description = "(Try to) preserve the original file access and modification times when resaving an image."

[[package.metadata.bashman.switches]]
short = "-p"
long = "--progress"
description = "Show pretty progress while minifying."

[[package.metadata.bashman.switches]]
short = "-V"
long = "--version"
description = "Print version information and exit."

[[package.metadata.bashman.options]]
short = "-j"
label = "<NUM>"
description = "Limit parallelization to this many threads (instead of giving each logical core its own image to work on). If negative, the value will be subtracted from the total number of logical cores."
path = false

[[package.metadata.bashman.options]]
short = "-l"
long = "--list"
label = "<FILE>"
description = "Read (absolute) image and/or directory paths from this text file — or STDIN if '-' — one entry per line, instead of or in addition to any trailing <PATH(S)>."
path = true

[[package.metadata.bashman.options]]
short = "-z"
long = "--lz77"
label = "<NUM>"
description = " Limit exhaustive LZW GIF frame encoding to subslices aligned to <NUM> bytes. Lower values yield better (more exhaustive) compression, but require *significantly* longer processing times. (Even worse than zopfli! Haha.) Set to zero to disable this optimization altogether. [default: 1, 2, or row count, based on resolution.]"
path = false

[[package.metadata.bashman.options]]
short = "-g"
long = "--lzw"
label = "<NUM>"
description = "Limit exhaustive LZW GIF frame encoding to subslices aligned to <NUM> bytes. Lower values tend to yield better compression, but require *significantly* longer processing times. Set to zero to disable this optimization altogether. [default: row size]"
path = false

[[package.metadata.bashman.options]]
long = "--max-resolution"
label = "<NUM>"
description = "Skip images containing more than <NUM> total pixels to avoid potential OOM errors during decompression. [default: ~4.29 billion]"
path = false

[[package.metadata.bashman.arguments]]
label = "<PATH(s)…>"
description = "One or more image and/or directory paths to losslessly re-compress."

[[package.metadata.bashman.sections]]
name = "EARLY EXIT"
inside = false
lines = [
	"Press CTRL+C once to quit as soon as the already-in-progress operations have",
	"finished (ignoring any pending images still in the queue).",
	"",
	"Press CTRL+C a second time if you need to exit IMMEDIATELY, but note that doing",
	"so may leave artifacts (temporary files) behind, and in rare cases, lead to",
	"image corruption.",
]

[[package.metadata.bashman.credits]]
name = "lodepng"
version = "2026.11.2"
license = "Zlib"
authors = [ "Lode Vandevenne" ]
repository = "https://github.com/lvandeve/lodepng"

[build-dependencies]
argyle = { workspace = true }

[dependencies]
ahash =        { workspace = true }
argyle =       { workspace = true }
dactyl =       { workspace = true }
dowser =       { workspace = true }
flapfli =      { workspace = true }
flume =        { workspace = true }
fyi_msg =      { workspace = true, features = ["signals"] }
gif =          { workspace = true, features = ["raii_no_panic", "std"] }
gif-dispose =  { workspace = true }
libc =         { workspace = true }
mozjpeg-sys =  { workspace = true, features = ["jpegtran", "nasm_simd", "unwinding"] }
oxipng =       { workspace = true, features = ["freestanding"] }
utc2k =        { workspace = true }
write_atomic = { workspace = true }
zune-jpeg =    { workspace = true }
