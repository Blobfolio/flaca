[package]
name = "flapfli"
version = "3.9.5"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "An opinionated Rust rewrite of Zopfli."
readme = ""
publish = false
exclude = [
	".gitignore",
	".righteous-sandbox.json",
	"doc",
	"justfile",
	"release",
]

[dependencies]
crc32fast = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }
cc =      { workspace = true }

[lib]
name = "flapfli"
crate-type = ["staticlib", "lib"]
